name: DevSecOps Security Pipeline

#sets up the trigger conditions (runs on push and pull_request to main) and a base setup job
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  pipeline-setup:
    name: Build & Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image (Smoke Test)
        run: |
          docker build -t vulnerable-flask-app .

  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: pipeline-setup

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config="p/default" --config="p/security-audit" --json --output=semgrep.json || true

      - name: Generate Automated Security Tickets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for the gh CLI
        run: |
          python ticket_generator.py

      - name: Upload SAST Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep.json
  
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: sast-scan # Ensures DAST runs only after SAST completes

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Application
        run: |
          docker build -t vulnerable-flask-app .
          docker run -d -p 5000:5000 vulnerable-flask-app
          sleep 10 # Wait for the Flask server to fully boot up

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: false # Prevents the pipeline from crashing so the report uploads

      - name: Upload DAST Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html